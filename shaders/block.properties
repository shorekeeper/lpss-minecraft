# Material ids arrive in the vertex shader as mc_Entity.x. Unmapped blocks read
# as -1 on this fork; the shaders clamp (id - 10000) to [0, 255].
#
#   0  anything unmapped: rough, porous, solid occluder
#   1  sodium lamps: emissive, do not occlude
#   2  water: forward-shaded, does not occlude
#   3  concrete / asphalt / stone: sealed, occluder
#   4  soil / vegetation / wood: porous, occluder
#   5  metal: high F0, occluder
#   6  fire / lava: emissive, orange-red
#   7  redstone torch: emissive, red, weak
#   8  glass / ice: does not occlude
#   9  thin things: do not occlude
#  10  leaves: occlude as a cube, direct light passes with LEAVES_TRANSMIT
#  11  floodlight: emissive, cold white, FLOOD_STRENGTH times a torch, the
#      whole block glows whatever its texture; does not occlude
#
# A solid block occludes as its mesh: a full cube as its whole cell,
# anything else by its triangles, so slabs, snow layers, fences and stairs
# shadow by their real shape even when unmapped. A triangle of a cutout
# texture, grass, flowers, bars, blocks where its sprite is opaque. Thin
# things that should not shadow at all go into 10009.
#
# Modded road, concrete and lamp blocks go into 10003 / 10001 as mod:block_name.
# An unmapped lamp does not light: at_midBlock.w on this fork holds the
# light a block receives, not what it emits, so it cannot mark lamps.

