# Site - overcast brutalist look.
#
# The sky is drawn in deferred.fsh where depth == 1.0, so the vanilla dome,
# sun, moon and stars are all switched off. Clouds are disabled by Angelica
# whenever shaders are active; the key is set anyway for clarity.
sky=false
sun=false
moon=false
stars=false
clouds=off
vignette=false
underwaterOverlay=false
oldLighting=false
separateAo=false

# The shadow pass exists to voxelize terrain, capture the player's triangles
# and box the other entities; nothing reads shadowtex. Because nothing reads
# it, the loader would skip the pass (and shadowcomp) unless told otherwise.
# culling=false means a box culler of shadowDistance, which is exactly the
# voxel grid.
shadow.enabled=true
shadow.culling=false
shadowTerrain=true
shadowTranslucent=false
# Moving entities are positioned by the engine in the shadow pass a tick
# behind the main pass and jitter across cell boundaries; their box shadows
# lag and flicker. Off by default; block entities are static and stay.
shadowEntities=false
shadowPlayer=true
shadowBlockEntities=true
voxelizeLightBlocks=true
iris.features.required=COMPUTE_SHADERS CUSTOM_IMAGES SSBO

# Entity triangle capture, see lib/entity_tris.glsl:
# 80 byte header + 512 cell heads + 2097152 list nodes + 2 sets * 4096 triangles * 3 * vec4
bufferObject.0=8783952
# Light list, see lib/lights.glsl: 16 byte header + 516 uint ray starts
# + 512 bin counts + 512 * 256 bin entries (LAMP_BIN_SLOTS at its largest)
# + 2 * 512 float weights + 2 * 512 guide slots + 2 sets * 512 * uvec4
bufferObject.1=552992
# Occluder neighbourhood, see lib/near.glsl: mask and voxel per cell, uvec2
bufferObject.2=16777216
# Fog deposit counters, see lib/fogvol.glsl: six uints per voxel, colour and flow
bufferObject.3=50331648
# Partial block triangles, see lib/terrain_tris.glsl:
# 16 byte header + 2048 mask keys + 1024 masks * 8 uint + 2 * 32768 dedup slots * 2 uint
# + 262144 * 2 uvec4 as linked + 262144 * 2 uvec4 compacted
bufferObject.4=17342480
# Entity cell hold, see lib/entity_age.glsl: one uint per voxel, two sets
bufferObject.5=16777216
# Guiding trees, see lib/guide.glsl: 1024 slots * (8 header + 2 sets * 256 * (child + weight) + 256 acc) uints
bufferObject.6=5275648
# Sky visibility, see lib/skyvol.glsl: 2 sets * 128^3 * (uvec2 moments + uint count)
bufferObject.7=50331648

# Custom images: <sampler> <format> <internalFormat> <pixelType> <clear> <relative> <w> <h> <d>
# The loader allows sixteen; any past that are dropped with a log line only,
# and every program using them reads unbound memory. All sixteen are in use.
# voxelImg is rebuilt every frame by the shadow pass.
image.voxelImg=voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
# Per-cell heads of the partial block triangle lists, rebuilt with the voxels
image.terrainHeadImg=terrainHeadSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128


# Bounce: per-block albedo rebuilt with the voxels, deposit counters zeroed
# by shadowcomp_a, the accumulated volume as a persistent pair.
image.voxelColorImg=voxelColorSampler RGBA RGBA8 UNSIGNED_BYTE true false 128 128 128
image.bounceAccR=bounceAccRSampler RED_INTEGER R32UI UNSIGNED_INT false false 128 128 128
image.bounceAccG=bounceAccGSampler RED_INTEGER R32UI UNSIGNED_INT false false 128 128 128
image.bounceAccB=bounceAccBSampler RED_INTEGER R32UI UNSIGNED_INT false false 128 128 128
image.bounceImgA=bounceSampler RGBA RGBA16F HALF_FLOAT false false 128 128 128
image.bounceImgB=bounceSamplerB RGBA RGBA16F HALF_FLOAT false false 128 128 128
# Fog volume, see lib/fogvol.glsl: a persistent pair written by frame parity
image.fogImgA=fogSamplerA RGBA RGBA16F HALF_FLOAT false false 128 128 128
image.fogImgB=fogSamplerB RGBA RGBA16F HALF_FLOAT false false 128 128 128
# Mean direction the block light travels in through each cell, weighted by
# luminance, same pair
image.fogDirImgA=fogDirSamplerA RGBA RGBA16F HALF_FLOAT false false 128 128 128
image.fogDirImgB=fogDirSamplerB RGBA RGBA16F HALF_FLOAT false false 128 128 128

# Temporal confidence, see lib/history.glsl: last frame's voxel
# classification and the reset flags, both in pairs by frame parity
image.voxelClassImgA=voxelClassSamplerA RED_INTEGER R8UI UNSIGNED_BYTE false false 128 128 128
image.voxelClassImgB=voxelClassSamplerB RED_INTEGER R8UI UNSIGNED_BYTE false false 128 128 128
image.resetImgA=resetSamplerA RED_INTEGER R8UI UNSIGNED_BYTE false false 128 128 128
image.resetImgB=resetSamplerB RED_INTEGER R8UI UNSIGNED_BYTE false false 128 128 128

